version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Installing pnpm...
      - npm install -g pnpm
      - echo Installing dependencies...
      - pnpm install

  build:
    commands:
      - echo Building web client...
      - cd hoppscotch-selfhost-web
      - pnpm run build
      - cd ../..

      - echo Building desktop client...
      - cd hoppscotch-selfhost-desktop
      - pnpm run build
      - cd ../..

  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - '**/*'
  base-directory: packages/web/dist  # Adjust if you want to collect artifacts from both web and desktop clients

cache:
  paths:
    - '~/.pnpm-store/**/*'
    - 'node_modules/**/*'
