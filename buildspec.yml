version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing pnpm..."
      - npm install -g pnpm
      - pnpm -v

  build:
    commands:
      - echo "Cloning your fork..."
      - git clone https://github.com/shikhartech/postman.git
      - cd postman/packages/hoppscotch-app
      - echo "Installing dependencies..."
      - pnpm install
      - echo "Building frontend..."
      - pnpm build

  post_build:
    commands:
      - echo "Deploying to S3 bucket..."
artifacts:
  files:
    - "**/*"
  base-directory: postman/packages/hoppscotch-app/.next
