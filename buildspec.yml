version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "[install] Updating system packages and installing prerequisites (Ubuntu)"
      - apt-get update -y
      - echo "[install] Installing pnpm globally"
      - npm install -g pnpm@8.15.5
      - pnpm -v
      - echo "[install] Installing Rust toolchain via rustup (required for desktop/tauri)"
      - curl -fsSL https://sh.rustup.rs -o rustup.sh
      - sh rustup.sh -y
      - export CARGO_HOME="$HOME/.cargo"
      - export RUSTUP_HOME="$HOME/.rustup"
      - export PATH="$CARGO_HOME/bin:$PATH"
      - rustc --version || true
      - echo "[install] Installing workspace dependencies"
      - pnpm install --frozen-lockfile

  build:
    commands:
      - echo "[build] Building all packages/* workspaces with pnpm"
      - pnpm -r --filter "./packages/**" run build

  post_build:
    commands:
      - echo "Build completed on $(date)"

artifacts:
  files:
    - packages/**/dist/**/*
    - packages/**/build/**/*
    - packages/**/out/**/*
    - packages/**/.next/**/*
    - packages/**/src-tauri/target/**/*
    - packages/**/webapp-server/target/**/*
    - packages/**/plugin-workspace/target/**/*
    - packages/**/public/**/*
    - package.json
    - pnpm-workspace.yaml
    - pnpm-lock.yaml

cache:
  paths:
    - '~/.pnpm-store/**/*'
    - 'node_modules/**/*'
    - 'packages/**/node_modules/**/*'
    - '~/.cargo/registry/index/**/*'
    - '~/.cargo/registry/cache/**/*'
    - '~/.cargo/git/db/**/*'
