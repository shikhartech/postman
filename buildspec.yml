version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Installing pnpm globally...
      - npm install -g pnpm
      - echo Installing project dependencies...
      - pnpm install

  pre_build:
    commands:
      - echo Checking for buildable packages...
      - BUILDABLE_PACKAGES=$(find packages -name package.json -exec grep -l '"build"' {} \; | xargs -n1 dirname)
      - echo "Packages with build scripts: $BUILDABLE_PACKAGES"

  build:
    commands:
      - for pkg in $BUILDABLE_PACKAGES; do
          echo "Building $pkg...";
          cd $pkg;
          pnpm run build;
          cd -;
        done

  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - '**/*'
  # If you only want the build outputs:
  base-directory: packages/web/dist   # Change to desktop/dist if needed

cache:
  paths:
    - '~/.pnpm-store/**/*'
    - 'node_modules/**/*'
