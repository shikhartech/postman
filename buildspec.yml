version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing pnpm..."
      - npm install -g pnpm
      - pnpm -v

  pre_build:
    commands:
      - echo "Cloning Hoppscotch repository..."

  build:
    commands:
      - echo "Installing dependencies..."
      - pnpm install
      - echo "Building Hoppscotch frontend..."
      - cd packages/hoppscotch-app
      - pnpm build

  post_build:
    commands:
      - echo "Deploying to ..."

artifacts:
  files:
    - "**/*"
  base-directory: packages/hoppscotch-app/.next
