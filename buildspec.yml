version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Installing pnpm...
      - npm install -g pnpm
      - echo Installing project dependencies...
      - pnpm install
  pre_build:
    commands:
      - echo Running lint 
  build:
    commands:
      - echo Building the project...
      - pnpm build:web   # for web
      # - pnpm build:desktop  # uncomment if you want desktop build
  post_build:
    commands:
      - echo Build completed on `date`
artifacts:
  files:
    - '**/*'
  base-directory: packages/web/dist  # Change to packages/desktop/dist if needed
cache:
  paths:
    - '~/.pnpm-store/**/*'
    - 'node_modules/**/*'
